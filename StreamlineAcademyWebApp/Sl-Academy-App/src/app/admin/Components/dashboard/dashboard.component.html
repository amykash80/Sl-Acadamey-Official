<div class="app-main__inner">
  <div class="app-page-title">
    <div class="page-title-wrapper">
      <div class="col">
        <nav aria-label="breadcrumb" class="border-bottom pr-3 py-3 mb-3">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">admin</li>
            <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>

  <div class="tabs-animation">
    <div class="row">
      <div class="col-sm-12 col-md-6 col-xl-4">
        <div class="card mb-3 widget-chart gradient-bb">
          <div class="widget-chart-content">
            <div class="icon-wrapper ml-0 rounded">
              <div class="icon-wrapper-bg bg-invert"></div>
              <i class="fa fa-university text-white"></i>
            </div>
            <div class="widget-numbers text-white"></div>
            <div
              style="cursor: pointer;"
              routerLink="/admin/academylist"
              class="widget-subheading fsize-1 pt-2 opacity-10 text-white font-weight-bold text-left"
            >
              Total academies
            </div>
            <div class="widget-description fw-bold opacity-8 text-left">
              <span class="text-white pr-1"></span>
              {{academyList.length}}
            </div>
          </div>
        </div>
      </div>
      
      <div class="col-sm-12 col-md-6 col-xl-4">
        <div class="card mb-3 widget-chart gradient-ww">
          <div class="widget-chart-content">
            <div class="icon-wrapper ml-0 rounded">
              <div class="icon-wrapper-bg bg-invert"></div>
              <i class="fa fa-question-circle text-white"></i>
            </div>
            <div class="widget-numbers text-white"></div>
            <div
              style="cursor: pointer;"
              routerLink="/admin/enquirylist"
              class="widget-subheading fsize-1 pt-2 opacity-10 text-white font-weight-bold text-left"
            >
              Total enquiries
            </div>
            <div class="widget-description fw-bold opacity-8 text-left">
              <span class="text-white pr-1">{{enquiryList.length}}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-sm-12 col-md-12 col-xl-4">
        <div class="card mb-3 widget-chart gradient-pp">
          <div class="widget-chart-content">
            <div class="icon-wrapper ml-0 rounded">
              <div class="icon-wrapper-bg bg-invert"></div>
              <i class="fas fa-list text-white"></i>
            </div>
            <div class="widget-numbers text-white"></div>
            <div
              style="cursor: pointer;"
              routerLink="/admin/academy-type-list"
              class="widget-subheading fsize-1 pt-2 opacity-10 text-white font-weight-bold text-left"
            >
              Total Academy Types
            </div>
            <div class="widget-description fw-bold opacity-8 text-left">
              <span class="text-danger pr-1">
                <span class="pl-1 text-white">{{academyTypeList.length}}</span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="app-drawer-overlay d-none animated fadeIn"></div>
